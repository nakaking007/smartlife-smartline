services:
  - type: web
    name: smartlife-smartline
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: TZ
        value: Asia/Bangkok
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DNS_SERVERS
        value: 8.8.8.8,1.1.1.1
      - key: LINE_ACCESS_TOKEN
        sync: false
      - key: LINE_USER_ID
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LIFF_ID
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: AI_FALLBACK_PROVIDERS
        value: gemini,groq,openrouter,huggingface,pollinations
      - key: IMAGE_PROVIDER
        value: pollinations
      - key: IMAGE_FALLBACK_PROVIDERS
        value: pollinations,openai,huggingface
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: POLLINATIONS_TEXT_MODEL
        value: openai
      - key: POLLINATIONS_IMAGE_MODEL
        value: flux
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1-mini
