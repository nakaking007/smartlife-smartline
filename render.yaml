services:
  - type: web
    name: smartlife-smartline
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_TIMEZONE
        value: Asia/Bangkok
      - key: LINE_SKIP_SIGNATURE_VERIFY
        value: "false"
      - key: ENABLE_USGS_EARTHQUAKE_ALERTS
        value: "true"
      - key: USGS_EARTHQUAKE_FEED
        value: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson
      - key: USGS_EARTHQUAKE_MIN_MAGNITUDE
        value: "4.5"
      - key: USGS_EARTHQUAKE_MAX_AGE_MINUTES
        value: "180"
      - key: MONGODB_URI
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: ALERT_INGEST_API_KEY
        sync: false
