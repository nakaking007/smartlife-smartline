name: Wake SmartLife for 06:00 report

on:
  schedule:
    # The early fallback offsets GitHub's observed schedule delay.
    - cron: '55 21 * * *'
    # Normal fallback: 22:55 UTC is 05:55 in Bangkok.
    - cron: '55 22 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run morning report and disaster catch-up
        run: curl --fail --silent --show-error --retry 3 --retry-delay 15 --request POST https://smartlife-smartline2.onrender.com/cron/morning-catchup
