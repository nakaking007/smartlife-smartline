name: Wake SmartLife for 06:00 report

on:
  schedule:
    # 23:01 UTC is 06:01 in Bangkok, after the in-app 06:00 job has had a minute to run.
    - cron: '1 23 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SmartLife health
        run: curl --fail --silent --show-error --max-time 30 https://smartlife-smartline2.onrender.com/health
      - name: Run morning report and disaster catch-up
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 15 --retry-connrefused --request POST https://smartlife-smartline2.onrender.com/cron/morning-catchup
