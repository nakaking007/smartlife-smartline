name: Wake SmartLife for 06:00 report

on:
  schedule:
    # Wake twice before 06:00 Bangkok, then run idempotent catch-up attempts.
    - cron: '45,55 22 * * *'
    - cron: '1,6,11 23 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check SmartLife health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 --retry-connrefused https://smartlife-smartline2.onrender.com/health
      - name: Run morning report and disaster catch-up
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '1,6,11 23 * * *'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 15 --retry-connrefused --header "Authorization: Bearer $CRON_SECRET" --request POST https://smartlife-smartline2.onrender.com/cron/morning-catchup
